[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-connectors"
version = "1.2.1"
description = "Standalone messaging connectors for autonomous agents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [
  { name = "connectors contributors" }
]
keywords = [
  "agents",
  "messaging",
  "telegram",
  "discord",
  "signal",
  "whatsapp",
  "home-assistant",
  "webhook",
  "slack",
  "imessage",
  "local-first"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
wizard = ["pyyaml>=6.0"]
test = ["pytest>=7.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/connectors#readme"
Documentation = "https://github.com/ellmos-ai/connectors#system-architecture"
Repository = "https://github.com/ellmos-ai/connectors"
"Bug Tracker" = "https://github.com/ellmos-ai/connectors/issues"
Changelog = "https://github.com/ellmos-ai/connectors/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/ellmos-ai/connectors/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/connectors/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/connectors/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/connectors/blob/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Parent Org" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.setuptools]
packages = ["connectors", "connectors.templates"]
include-package-data = true

[tool.setuptools.package-dir]
connectors = "."

[tool.setuptools.package-data]
connectors = ["templates/*.yaml"]

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "templates/connector_template.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "I001"]

[tool.ruff.lint.per-file-ignores]
"base.py" = ["F401"]
"discord_connector.py" = ["F401"]
"templates/setup_wizard.py" = ["F401", "F541"]
"tests/test_imports.py" = ["F401"]
"tests/test_templates.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -v"
